name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fmt:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  taplo-fmt:
    name: TOML Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: uncenter/setup-taplo@v2
      - run: taplo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }}, ${{ matrix.backend }}${{ matrix.serde && ' + serde' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [rtaudio, cpal, juce]
        serde: [false]
        include:
          - os: ubuntu-latest
            backend: rtaudio
            serde: true
          - os: ubuntu-latest
            backend: cpal
            serde: true
          - os: ubuntu-latest
            backend: juce
            serde: true
    defaults:
      run:
        shell: bash
    env:
      FEATURES: ${{ matrix.backend }}${{ matrix.serde && ',serde' || '' }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.FEATURES }}
      - run: cargo clippy --locked --all-targets --no-default-features --features "$FEATURES" -- -D warnings
      - run: cargo build --locked --all-targets --no-default-features --features "$FEATURES"
      # hardware tests are #[ignore]d, run them locally with `cargo test -- --ignored`
      - run: cargo test --locked --no-default-features --features "$FEATURES"
      - if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps --document-private-items --no-default-features --features "$FEATURES"
        env:
          RUSTDOCFLAGS: -D warnings

  semver:
    name: Semver Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features

  msrv:
    name: MSRV Check (${{ matrix.backend }}${{ matrix.serde && ' + serde' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [rtaudio, cpal, juce]
        serde: [false, true]
    env:
      FEATURES: ${{ matrix.backend }}${{ matrix.serde && ',serde' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.FEATURES }}
      - run: cargo check --locked --all-targets --no-default-features --features "$FEATURES"

  readme:
    name: README Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-rdme
      - run: cargo rdme --check

  unused-dependencies:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - run: cargo shear
